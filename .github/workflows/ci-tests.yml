name: CI - Automated Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

jobs:
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        mongodb-version: ['6.0', '7.0']
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: 🍃 Start MongoDB ${{ matrix.mongodb-version }}
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔧 Setup environment
        run: |
          cp env.example .env
          echo "MONGODB_URI=mongodb://localhost:27017/cat_modeling_test" >> .env
          echo "USE_MOCK_DB=false" >> .env
          echo "PORT=3001" >> .env
      
      - name: 🌱 Seed test database
        run: npm run seed:fixed
      
      - name: 🚀 Start backend server
        run: |
          npm run start:backend &
          sleep 10
        
      - name: 🧪 Run backend API tests
        run: npm run test:backend
      
      - name: 🔨 Run CRUD tests
        run: npm run test:backend:crud
      
      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-node-${{ matrix.node-version }}-mongo-${{ matrix.mongodb-version }}
          path: |
            coverage/
            test-results/
  
  frontend-tests:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: 🔍 Lint frontend
        working-directory: frontend
        run: npm run lint || true
      
      - name: 🏗️  Build frontend
        working-directory: frontend
        run: npm run build
      
      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
  
  integration-tests:
    name: Integration Tests (Full Stack)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: 🍃 Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'
      
      - name: 📦 Install all dependencies
        run: |
          npm ci
          cd frontend && npm ci && cd ..
      
      - name: 🔧 Setup environment
        run: |
          cp env.example .env
          echo "MONGODB_URI=mongodb://localhost:27017/cat_modeling_test" >> .env
          echo "USE_MOCK_DB=false" >> .env
          echo "PORT=3001" >> .env
          cd frontend
          cp .env.example .env
          echo "REACT_APP_API_URL=http://localhost:3001/api/v1" >> .env
          cd ..
      
      - name: 🌱 Seed database
        run: npm run seed:fixed
      
      - name: 🚀 Start backend & frontend
        run: |
          npm run start:backend &
          cd frontend && PORT=3000 npm start &
          sleep 20
      
      - name: 🧪 Run integration tests
        run: npm run test:all
      
      - name: 📊 Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            coverage/
            test-results/
  
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Run ESLint (Backend)
        run: npx eslint src/ --ext .js || true
      
      - name: 📊 Generate test coverage
        run: npm run test:coverage || true
      
      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: backend
          name: backend-coverage
  
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: 🔒 Run npm audit
        run: npm audit --production || true
      
      - name: 🛡️  Security scan with Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-tests, code-quality]
    if: always()
    
    steps:
      - name: 📧 Send notification
        run: |
          echo "🎉 CI Pipeline completed!"
          echo "Backend tests: ${{ needs.backend-tests.result }}"
          echo "Frontend tests: ${{ needs.frontend-tests.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"
          echo "Code quality: ${{ needs.code-quality.result }}"


