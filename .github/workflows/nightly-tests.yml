name: Nightly - Comprehensive Testing

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  comprehensive-tests:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: 🍃 Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'
      
      - name: 📦 Install dependencies
        run: |
          npm ci
          cd frontend && npm ci && cd ..
      
      - name: 🔧 Setup environment
        run: |
          cp env.example .env
          echo "MONGODB_URI=mongodb://localhost:27017/cat_modeling_test" >> .env
          echo "USE_MOCK_DB=false" >> .env
          npm run setup:env
      
      - name: 🌱 Seed comprehensive test data
        run: npm run seed:fixed
      
      - name: 🚀 Start services
        run: |
          npm run start:backend &
          cd frontend && npm start &
          sleep 30
      
      - name: 🧪 Run all tests
        run: |
          npm run test:backend:all
          npm run test:ui:puppeteer || true
      
      - name: 📊 Generate coverage report
        run: npm run test:coverage
      
      - name: 📤 Upload comprehensive results
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: |
            coverage/
            test-results/
            logs/
      
      - name: 📧 Notify on failure
        if: failure()
        run: |
          echo "❌ Nightly tests failed!"
          echo "Check the artifacts for detailed results"


