name: Performance Testing

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  performance-tests:
    name: API Performance Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: 🍃 Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔧 Setup environment
        run: |
          cp env.example .env
          npm run setup:env
          npm run seed:fixed
      
      - name: 🚀 Start backend
        run: |
          npm run start:backend &
          sleep 10
      
      - name: ⚡ Run load tests
        run: |
          npx autocannon -c 10 -d 30 http://localhost:3001/api/v1/accounts || true
          npx autocannon -c 10 -d 30 http://localhost:3001/api/v1/hazards || true
          npx autocannon -c 10 -d 30 http://localhost:3001/api/v1/simulations/dashboard || true
      
      - name: 📊 Performance summary
        run: |
          echo "✅ Performance tests completed"
          echo "Check logs for detailed metrics"


