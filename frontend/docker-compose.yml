version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3001:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api/v1
    depends_on:
      - backend
    networks:
      - cat-modeling-network

  backend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ../:/app
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    networks:
      - cat-modeling-network

networks:
  cat-modeling-network:
    driver: bridge
